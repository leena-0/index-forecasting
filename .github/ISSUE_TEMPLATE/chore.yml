name: "작업 (chore)"
description: 문서, 리팩터링, 설정 등 유지보수 작업을 제안합니다.
title: "[chore] "
labels: ["chore"]
body:
  - type: textarea
    id: task
    attributes:
      label: 작업 내용
      description: 해야 할 일과 그 이유를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: 세부 작업
      placeholder: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 검증 방법이나 산출물을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 참고 자료
