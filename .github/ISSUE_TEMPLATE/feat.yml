name: "기능 (feat)"
description: 새로운 기능이나 개선 사항을 제안합니다.
title: "[feat] "
labels: ["feat"]
body:
  - type: markdown
    attributes:
      value: 필요한 기능을 간단히 작성해 주세요.
  - type: textarea
    id: feature
    attributes:
      label: 기능 설명
      description: 필요한 이유와 원하는 동작을 작성해 주세요.
      placeholder: |
        무엇을 왜 추가해야 하는지 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 필요한 경우 완료 기준을 체크리스트로 작성해 주세요. (선택)
      placeholder: |
        - [ ] 기능이 예상대로 동작한다.
        - [ ] 테스트와 문서가 갱신된다.
  - type: textarea
    id: context
    attributes:
      label: 참고 자료
      description: 관련 문서, 이슈 또는 추가 맥락이 있다면 적어 주세요. (선택)
