name: Issue label

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Create and apply the issue type label
        uses: actions/github-script@v7
        with:
          script: |
            const types = {
              '[feat]': { name: 'feat', color: '1D76DB', description: '새로운 기능 또는 개선' },
              '[fix]': { name: 'fix', color: 'D73A4A', description: '버그 수정' },
              '[chore]': { name: 'chore', color: '6E7781', description: '유지보수 및 기타 작업' },
            };
            const entry = Object.entries(types).find(([prefix]) =>
              context.payload.issue.title.toLowerCase().startsWith(prefix)
            );
            if (!entry) return;

            const label = entry[1];
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label.name,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ...label,
              });
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label.name],
            });
