# 하이퍼파라미터 그리드 (python -m src.tune, docs/TUNING.md)
# 모델 이름 → {파라미터: [후보, ...]}. 모든 조합을 학습하고, 각 조합마다 편향 보정 없음/있음을 함께 평가한다.
# 선택 기준: 검증 구간(2022~2023) 평균 QLIKE. 테스트 구간은 쓰지 않는다.

ewma:
  lam: [0.90, 0.94, 0.97, 0.99]

har: {}   # 하이퍼파라미터 없음 (편향 보정 유무만 비교)

lgbm:
  learning_rate: [0.03, 0.1]
  num_leaves: [15, 63]
  min_data_in_leaf: [100, 1000]
  num_boost_round: [200, 600]

lstm:
  lookback: [22, 44]
  hidden: [16, 64]
  epochs: [5, 10]
